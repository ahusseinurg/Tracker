name: Build Phone Archive APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PhoneActivity-v0.7.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneActivity-v0.7.0-APK
          path: PhoneActivity-v0.7.0.apk
          if-no-files-found: error
          retention-days: 30
