name: Build Phone Archive APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore release keystore
        run: echo "${{ secrets.MAPING_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/Maping-release.jks"

      - name: Build signed release APK
        env:
          MAPING_KEYSTORE_PATH: ${{ runner.temp }}/Maping-release.jks
          MAPING_KEYSTORE_PASSWORD: ${{ secrets.MAPING_KEYSTORE_PASSWORD }}
          MAPING_KEY_ALIAS: ${{ secrets.MAPING_KEY_ALIAS }}
          MAPING_KEY_PASSWORD: ${{ secrets.MAPING_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Maping-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Maping-signed-release-APK
          path: Maping-release.apk
          if-no-files-found: error
          retention-days: 30
