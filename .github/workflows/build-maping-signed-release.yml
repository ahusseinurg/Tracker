name: Build Maping Signed Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-maping-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Maping source branch
        uses: actions/checkout@v4
        with:
          ref: phone-archive-apk

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore permanent release keystore
        run: echo "${{ secrets.MAPING_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/Maping-release.jks"

      - name: Build permanently signed Maping APK
        env:
          MAPING_KEYSTORE_PATH: ${{ runner.temp }}/Maping-release.jks
          MAPING_KEYSTORE_PASSWORD: ${{ secrets.MAPING_KEYSTORE_PASSWORD }}
          MAPING_KEY_ALIAS: ${{ secrets.MAPING_KEY_ALIAS }}
          MAPING_KEY_PASSWORD: ${{ secrets.MAPING_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Verify signed APK exists
        run: test -s app/build/outputs/apk/release/app-release.apk

      - name: Upload signed Maping APK
        uses: actions/upload-artifact@v4
        with:
          name: Maping-signed-release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
