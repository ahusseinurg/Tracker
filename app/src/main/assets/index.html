<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15805a"><title>Budget & Income</title>
<style>
:root{--ink:#16251e;--muted:#68776f;--line:#dfe7e1;--cream:#f4f6f1;--green:#15805a;--green2:#e1f3ea;--red:#c34d48;--red2:#fae9e7}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif;font-size:17px}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:620px;margin:auto;padding:calc(26px + env(safe-area-inset-top)) 18px calc(105px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:start;margin-bottom:28px}.eyebrow{margin:0 0 8px;color:var(--green);font-size:12px;font-weight:800;letter-spacing:.14em}h1,h2{font-family:Georgia,serif;margin:0}h1{font-size:36px;line-height:1.05}.sub{margin:12px 0 0;color:var(--muted);font-size:16px;line-height:1.5}.date{font-size:13px;font-weight:800;background:#fff;border:1px solid var(--line);border-radius:99px;padding:10px 13px}.view{display:none}.view.active{display:block}.summary{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}.stat{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}.stat:last-child{grid-column:1/-1}.stat:before{content:"";position:absolute;inset:0 auto 0 0;width:5px}.stat.in:before{background:var(--green)}.stat.out:before{background:var(--red)}.stat.bal:before{background:#cb9b35}.stat span,.stat small{display:block;color:var(--muted);font-size:14px;font-weight:700}.stat strong{display:block;font-family:Georgia,serif;font-size:29px;margin:10px 0 5px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:18px}.toggle{display:grid;grid-template-columns:1fr 1fr;background:#edf1ed;border-radius:13px;padding:5px;margin-bottom:24px}.toggle button{border:0;background:transparent;border-radius:10px;padding:14px 8px;color:var(--muted);font-weight:800;font-size:15px}.toggle .active{background:#fff;box-shadow:0 2px 8px #0001}.toggle .active.income{color:var(--green)}.toggle .active.expense{color:var(--red)}label{display:block;color:#3a4c43;font-size:15px;font-weight:800;margin-bottom:20px}input,select{width:100%;border:1px solid #d7e1da;border-radius:12px;background:#fafbf9;padding:15px;margin-top:8px;outline:none;font-size:17px;min-height:54px}.amount{display:flex;align-items:center;border:1px solid #d7e1da;border-radius:12px;background:#fafbf9;margin-top:8px;padding-left:15px}.amount span{font-size:26px;color:var(--muted)}.amount input{border:0;margin:0;background:transparent;font-size:32px;font-weight:800}.row{display:grid;grid-template-columns:1fr;gap:0}.save,.primary{width:100%;border:0;border-radius:12px;color:#fff;padding:17px;font-size:17px;font-weight:800;background:var(--green)}.save.expense{background:var(--red)}.primary{margin-top:2px}.budget-head,.budget-values,.activity-head{display:flex;justify-content:space-between;align-items:center}.budget-head h2,.activity-head h2{font-size:27px}.badge{background:var(--green2);color:var(--green);border-radius:99px;padding:9px 11px;font-weight:800;font-size:14px}.bar{height:12px;background:#e8ede9;border-radius:99px;overflow:hidden;margin:28px 0 18px}.bar i{display:block;height:100%;background:var(--green)}.budget-values small{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}.budget-values b{font-size:18px}.budget-values div:last-child{text-align:right}.filters{display:flex;background:#edf1ed;padding:5px;border-radius:11px;margin:20px 0 6px}.filters button{flex:1;border:0;background:transparent;border-radius:8px;padding:11px 5px;color:var(--muted);font-size:14px;font-weight:700}.filters .active{background:white;color:var(--ink)}.empty{text-align:center;color:var(--muted);padding:46px 12px;line-height:1.5}.empty b{display:block;color:var(--ink);font-size:19px;margin-bottom:9px}.entry{display:flex;align-items:center;gap:12px;border-top:1px solid #edf1ed;padding:17px 0}.icon{display:grid;place-items:center;min-width:42px;height:42px;border-radius:12px;font-size:20px}.icon.income{background:var(--green2);color:var(--green)}.icon.expense{background:var(--red2);color:var(--red)}.entry-main{flex:1;min-width:0}.entry-main b,.entry-main small,.value b,.value small{display:block}.entry-main b,.value b{font-size:16px}.entry-main small,.value small{color:var(--muted);font-size:13px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.value{text-align:right}.value .income{color:var(--green)}.value .expense{color:var(--red)}.delete{border:0;background:transparent;color:#9ba69f;font-size:26px;padding:8px}.tools{display:flex;gap:10px;margin-top:18px}.tools button{flex:1;border:1px solid var(--line);background:white;border-radius:11px;padding:13px;color:var(--muted);font-size:14px;font-weight:700}.notice{text-align:center;color:var(--muted);font-size:13px;margin-top:18px;line-height:1.4}.bottom-nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:10}.bottom-nav button{width:min(31%,180px);border:0;background:transparent;border-radius:12px;padding:11px 4px;color:var(--muted);font-size:14px;font-weight:800}.bottom-nav button span{display:block;font-size:21px;margin-bottom:4px}.bottom-nav button.active{background:var(--green2);color:var(--green)}@media(max-width:390px){.app{padding-left:14px;padding-right:14px}.date{display:none}.summary{grid-template-columns:1fr}.stat:last-child{grid-column:auto}}@media(min-width:650px){.summary{grid-template-columns:repeat(3,1fr)}.stat:last-child{grid-column:auto}}
</style></head><body><main class="app">
<header class="top"><div><p class="eyebrow">MY MONEY</p><h1>Budget & Income</h1><p class="sub">Track what came in, went out, and is left.</p></div><div class="date" id="today"></div></header>
<section class="view active" data-view="overview"><section class="summary"><article class="stat in"><span>Income</span><strong id="incomeTotal">$0.00</strong><small id="incomePeriod">this month</small></article><article class="stat out"><span>Expenses</span><strong id="expenseTotal">$0.00</strong><small id="expensePeriod">this month</small></article><article class="stat bal"><span>Money left</span><strong id="balance">$0.00</strong><small id="balanceNote">available</small></article></section><section class="card"><div class="budget-head"><div><p class="eyebrow">MONTHLY PLAN</p><h2>Budget progress</h2></div><span class="badge" id="percent">0%</span></div><div class="bar"><i id="bar" style="width:0"></i></div><div class="budget-values"><div><small>Spent</small><b id="spent">$0.00</b></div><div><small>Remaining</small><b id="remaining">$0.00</b></div></div><label style="margin-top:24px">Monthly budget<input id="budget" type="number" min="0" step="1"></label><button class="primary" data-open="add">Add income or expense</button></section><p class="notice">Private and offline — your information stays on this phone.</p></section>
<section class="view" data-view="add"><section class="card"><div class="toggle"><button id="incomeTab" class="active income">+ Add income</button><button id="expenseTab">− Add expense</button></div><form id="entryForm"><label>Amount<div class="amount"><span>$</span><input id="amount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0.00" required></div></label><div class="row"><label>Date<input id="date" type="date" required></label><label>Type<select id="category"></select></label></div><label id="customWrap" hidden>Custom type<input id="customCategory" placeholder="Enter a type"></label><label>Note <small>(optional)</small><input id="note" placeholder="Where did this money come from?"></label><button class="save" id="saveButton">Save income</button></form></section></section>
<section class="view" data-view="activity"><section class="card"><div class="activity-head"><div><p class="eyebrow">ACTIVITY</p><h2>Transactions</h2></div></div><div class="filters"><button data-filter="today">Today</button><button data-filter="month" class="active">This month</button><button data-filter="all">All</button></div><div id="entries"></div><div class="tools"><button id="exportBtn" type="button">Save backup</button><button id="restoreBtn" type="button">Restore backup</button></div><input id="restoreFile" type="file" accept="application/json,.json" hidden><div class="tools"><button id="clearBtn" type="button">Clear all records</button></div></section></section>
<nav class="bottom-nav"><button class="active" data-open="overview"><span>⌂</span>Overview</button><button data-open="add"><span>＋</span>Add</button><button data-open="activity"><span>☰</span>Activity</button></nav>
</main><script>
(function(){
const incomeTypes=['Salary','Business','Cash','Farm sales','Services','Tips','Gift','Benefits','Refund','Investment','Other'];
const expenseTypes=['Housing','Food','Transportation','Utilities','Family','Health','Farm','Business','Debt','Savings','Other'];
const $=id=>document.getElementById(id), money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n||0);
const localDate=()=>{const d=new Date(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${d.getFullYear()}-${m}-${day}`};
let entries=[],kind='income',filter='month',budget=2500,editingId=null;
try{entries=JSON.parse(localStorage.getItem('budgetEntries')||'[]');budget=Number(localStorage.getItem('monthlyBudget')||2500)}catch(e){}
$('date').value=localDate();$('today').textContent=new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'});$('budget').value=budget;
function categories(){const list=kind==='income'?incomeTypes:expenseTypes;$('category').innerHTML=list.map(x=>`<option>${x}</option>`).join('');$('customWrap').hidden=true;$('customCategory').required=false}
function switchKind(next){kind=next;$('incomeTab').className=next==='income'?'active income':'';$('expenseTab').className=next==='expense'?'active expense':'';$('saveButton').className='save '+next;$('saveButton').textContent='Save '+next;$('note').placeholder=next==='income'?'Where did this money come from?':'What did you pay for?';categories()}
function save(){try{localStorage.setItem('budgetEntries',JSON.stringify(entries));localStorage.setItem('monthlyBudget',String(budget));return true}catch(e){alert('The app could not save your changes. Please make a backup and try again.');return false}}
function visible(){const now=localDate();return entries.filter(e=>filter==='all'||(filter==='today'?e.date===now:e.date.slice(0,7)===now.slice(0,7))).sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created)}
function render(){const list=visible(),inc=list.filter(e=>e.kind==='income').reduce((s,e)=>s+e.amount,0),exp=list.filter(e=>e.kind==='expense').reduce((s,e)=>s+e.amount,0),bal=inc-exp,now=localDate(),monthExp=entries.filter(e=>e.kind==='expense'&&e.date.slice(0,7)===now.slice(0,7)).reduce((s,e)=>s+e.amount,0),pct=budget?Math.min(100,monthExp/budget*100):0,period=filter==='today'?'today':filter==='month'?'this month':'all time';$('incomeTotal').textContent=money(inc);$('expenseTotal').textContent=money(exp);$('balance').textContent=money(bal);$('balanceNote').textContent=bal>=0?'available':'over spent';$('incomePeriod').textContent=$('expensePeriod').textContent=period;$('spent').textContent=money(monthExp);$('remaining').textContent=money(budget-monthExp);$('percent').textContent=Math.round(pct)+'%';$('bar').style.width=pct+'%';
$('entries').innerHTML=list.length?list.map(e=>`<article class="entry"><span class="icon ${e.kind}">${e.kind==='income'?'↗':'↙'}</span><div class="entry-main"><b>${escapeHtml(e.category)}</b><small>${escapeHtml(e.note||(e.kind==='income'?'Income received':'Expense paid'))}</small></div><div class="value"><b class="${e.kind}">${e.kind==='income'?'+':'−'}${money(e.amount)}</b><small>${new Date(e.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}</small></div><button class="delete edit" data-id="${e.id}">✎</button><button class="delete remove" data-id="${e.id}">×</button></article>`).join(''):'<div class="empty"><b>No entries yet</b>Add your first income or expense above.</div>';
document.querySelectorAll('.remove').forEach(b=>b.onclick=()=>{if(confirm('Delete this transaction?')){entries=entries.filter(e=>e.id!==b.dataset.id);save();render()}});document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>editEntry(b.dataset.id))}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('incomeTab').onclick=()=>switchKind('income');$('expenseTab').onclick=()=>switchKind('expense');$('category').onchange=()=>{$('customWrap').hidden=$('category').value!=='Other';$('customCategory').required=$('category').value==='Other'};
$('entryForm').onsubmit=e=>{e.preventDefault();const amount=Number($('amount').value),cat=$('category').value==='Other'?$('customCategory').value.trim():$('category').value;if(!amount||!cat)return;const record={id:editingId||Date.now()+'-'+Math.random().toString(36).slice(2),created:editingId?(entries.find(x=>x.id===editingId)||{}).created||Date.now():Date.now(),kind,amount,category:cat,note:$('note').value.trim(),date:$('date').value};if(editingId)entries=entries.map(x=>x.id===editingId?record:x);else entries.push(record);editingId=null;$('saveButton').textContent='Save '+kind;$('amount').value='';$('note').value='';$('customCategory').value='';if(save()){render();openView('activity')}};
function editEntry(id){const e=entries.find(x=>x.id===id);if(!e)return;editingId=id;switchKind(e.kind);$('amount').value=e.amount;$('date').value=e.date;$('note').value=e.note||'';const options=e.kind==='income'?incomeTypes:expenseTypes;if(options.includes(e.category)){$('category').value=e.category;$('customWrap').hidden=true}else{$('category').value='Other';$('customWrap').hidden=false;$('customCategory').value=e.category}$('saveButton').textContent='Update transaction';openView('add')}
$('budget').onchange=()=>{budget=Math.max(0,Number($('budget').value)||0);save();render()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});
$('exportBtn').onclick=()=>{const json=JSON.stringify({app:'Budget & Income',version:1,exported:new Date().toISOString(),budget,entries},null,2);if(window.AndroidApp&&AndroidApp.saveBackup)AndroidApp.saveBackup(json);else{const blob=new Blob([json],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Budget-Income-Tracker-Backup.json';a.click();URL.revokeObjectURL(a.href)}};
$('restoreBtn').onclick=()=>$('restoreFile').click();$('restoreFile').onchange=e=>{const file=e.target.files&&e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!Array.isArray(data.entries)||typeof data.budget!=='number')throw new Error();if(confirm('Replace the records on this phone with this backup?')){entries=data.entries;budget=data.budget;$('budget').value=budget;save();render();alert('Backup restored successfully.')}}catch(err){alert('This is not a valid Budget & Income backup file.')}e.target.value=''};reader.readAsText(file)};
$('clearBtn').onclick=()=>{if(confirm('Delete every income and expense entry from this phone?')){entries=[];save();render()}};
function openView(name){document.querySelectorAll('[data-view]').forEach(v=>v.classList.toggle('active',v.dataset.view===name));document.querySelectorAll('.bottom-nav [data-open]').forEach(b=>b.classList.toggle('active',b.dataset.open===name));window.scrollTo(0,0)}document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openView(b.dataset.open));
categories();render();
})();
</script></body></html>
