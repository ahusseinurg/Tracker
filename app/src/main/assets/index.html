<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15805a"><title>Budget & Income</title>
<style>
:root{--ink:#16251e;--muted:#68776f;--line:#dfe7e1;--cream:#f4f6f1;--green:#15805a;--green2:#e1f3ea;--red:#c34d48;--red2:#fae9e7}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:720px;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 12px calc(30px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:start;margin-bottom:18px}.eyebrow{margin:0 0 5px;color:var(--green);font-size:10px;font-weight:800;letter-spacing:.16em}h1,h2{font-family:Georgia,serif;margin:0}h1{font-size:30px}.sub{margin:8px 0 0;color:var(--muted);font-size:13px}.date{font-size:11px;font-weight:800;background:#fff;border:1px solid var(--line);border-radius:99px;padding:9px 11px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}.stat{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px}.stat:last-child{grid-column:1/-1}.stat:before{content:"";position:absolute;inset:0 auto 0 0;width:4px}.stat.in:before{background:var(--green)}.stat.out:before{background:var(--red)}.stat.bal:before{background:#cb9b35}.stat span,.stat small{display:block;color:var(--muted);font-size:11px;font-weight:700}.stat strong{display:block;font-family:Georgia,serif;font-size:23px;margin:7px 0 3px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px}.toggle{display:grid;grid-template-columns:1fr 1fr;background:#edf1ed;border-radius:11px;padding:4px;margin-bottom:17px}.toggle button{border:0;background:transparent;border-radius:8px;padding:10px;color:var(--muted);font-weight:800}.toggle .active{background:#fff;box-shadow:0 2px 8px #0001}.toggle .active.income{color:var(--green)}.toggle .active.expense{color:var(--red)}label{display:block;color:#3a4c43;font-size:11px;font-weight:800;margin-bottom:13px}input,select{width:100%;border:1px solid #d7e1da;border-radius:9px;background:#fafbf9;padding:12px;margin-top:6px;outline:none}.amount{display:flex;align-items:center;border:1px solid #d7e1da;border-radius:9px;background:#fafbf9;margin-top:6px;padding-left:12px}.amount span{font-size:20px;color:var(--muted)}.amount input{border:0;margin:0;background:transparent;font-size:23px;font-weight:800}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.save{width:100%;border:0;border-radius:10px;color:#fff;padding:13px;font-weight:800;background:var(--green)}.save.expense{background:var(--red)}.budget-head,.budget-values,.activity-head{display:flex;justify-content:space-between;align-items:center}.budget-head h2,.activity-head h2{font-size:21px}.badge{background:var(--green2);color:var(--green);border-radius:99px;padding:7px;font-weight:800;font-size:12px}.bar{height:9px;background:#e8ede9;border-radius:99px;overflow:hidden;margin:20px 0 13px}.bar i{display:block;height:100%;background:var(--green)}.budget-values small{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}.budget-values div:last-child{text-align:right}.filters{display:flex;background:#edf1ed;padding:3px;border-radius:9px;margin-top:13px}.filters button{flex:1;border:0;background:transparent;border-radius:7px;padding:8px 5px;color:var(--muted);font-size:11px;font-weight:700}.filters .active{background:white;color:var(--ink)}.empty{text-align:center;color:var(--muted);padding:28px 8px}.empty b{display:block;color:var(--ink);margin-bottom:6px}.entry{display:flex;align-items:center;gap:9px;border-top:1px solid #edf1ed;padding:12px 0}.icon{display:grid;place-items:center;min-width:34px;height:34px;border-radius:10px}.icon.income{background:var(--green2);color:var(--green)}.icon.expense{background:var(--red2);color:var(--red)}.entry-main{flex:1;min-width:0}.entry-main b,.entry-main small,.value b,.value small{display:block}.entry-main small,.value small{color:var(--muted);font-size:10px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.value{text-align:right}.value .income{color:var(--green)}.value .expense{color:var(--red)}.delete{border:0;background:transparent;color:#9ba69f;font-size:20px}.tools{display:flex;gap:8px;margin-top:12px}.tools button{flex:1;border:1px solid var(--line);background:white;border-radius:9px;padding:9px;color:var(--muted);font-size:11px;font-weight:700}.notice{text-align:center;color:var(--muted);font-size:10px;margin-top:14px}@media(min-width:650px){.summary{grid-template-columns:repeat(3,1fr)}.stat:last-child{grid-column:auto}.content{display:grid;grid-template-columns:1.15fr .85fr;gap:10px}.content .card{align-self:start}}
</style></head><body><main class="app">
<header class="top"><div><p class="eyebrow">MY MONEY</p><h1>Budget & Income</h1><p class="sub">Track what came in, went out, and is left.</p></div><div class="date" id="today"></div></header>
<section class="summary"><article class="stat in"><span>Income</span><strong id="incomeTotal">$0.00</strong><small id="incomePeriod">this month</small></article><article class="stat out"><span>Expenses</span><strong id="expenseTotal">$0.00</strong><small id="expensePeriod">this month</small></article><article class="stat bal"><span>Money left</span><strong id="balance">$0.00</strong><small id="balanceNote">available</small></article></section>
<div class="content"><section class="card"><div class="toggle"><button id="incomeTab" class="active income">+ Add income</button><button id="expenseTab">− Add expense</button></div><form id="entryForm"><label>Amount<div class="amount"><span>$</span><input id="amount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0.00" required></div></label><div class="row"><label>Date<input id="date" type="date" required></label><label>Type<select id="category"></select></label></div><label id="customWrap" hidden>Custom type<input id="customCategory" placeholder="Enter a type"></label><label>Note <small>(optional)</small><input id="note" placeholder="Where did this money come from?"></label><button class="save" id="saveButton">Save income</button></form></section>
<section class="card"><div class="budget-head"><div><p class="eyebrow">MONTHLY PLAN</p><h2>Budget progress</h2></div><span class="badge" id="percent">0%</span></div><div class="bar"><i id="bar" style="width:0"></i></div><div class="budget-values"><div><small>Spent</small><b id="spent">$0.00</b></div><div><small>Remaining</small><b id="remaining">$0.00</b></div></div><label style="margin-top:18px">Monthly budget<input id="budget" type="number" min="0" step="1"></label></section></div>
<section class="card"><div class="activity-head"><div><p class="eyebrow">ACTIVITY</p><h2>Transactions</h2></div></div><div class="filters"><button data-filter="today">Today</button><button data-filter="month" class="active">This month</button><button data-filter="all">All</button></div><div id="entries"></div><div class="tools"><button id="exportBtn" type="button">Export backup</button><button id="clearBtn" type="button">Clear all</button></div></section><p class="notice">Private and offline — your information stays on this phone.</p>
</main><script>
(function(){
const incomeTypes=['Salary','Business','Cash','Farm sales','Services','Tips','Gift','Benefits','Refund','Investment','Other'];
const expenseTypes=['Housing','Food','Transportation','Utilities','Family','Health','Farm','Business','Debt','Savings','Other'];
const $=id=>document.getElementById(id), money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n||0);
const localDate=()=>{const d=new Date(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${d.getFullYear()}-${m}-${day}`};
let entries=[],kind='income',filter='month',budget=2500;
try{entries=JSON.parse(localStorage.getItem('budgetEntries')||'[]');budget=Number(localStorage.getItem('monthlyBudget')||2500)}catch(e){}
$('date').value=localDate();$('today').textContent=new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'});$('budget').value=budget;
function categories(){const list=kind==='income'?incomeTypes:expenseTypes;$('category').innerHTML=list.map(x=>`<option>${x}</option>`).join('');$('customWrap').hidden=true}
function switchKind(next){kind=next;$('incomeTab').className=next==='income'?'active income':'';$('expenseTab').className=next==='expense'?'active expense':'';$('saveButton').className='save '+next;$('saveButton').textContent='Save '+next;$('note').placeholder=next==='income'?'Where did this money come from?':'What did you pay for?';categories()}
function save(){localStorage.setItem('budgetEntries',JSON.stringify(entries));localStorage.setItem('monthlyBudget',String(budget))}
function visible(){const now=localDate();return entries.filter(e=>filter==='all'||(filter==='today'?e.date===now:e.date.slice(0,7)===now.slice(0,7))).sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created)}
function render(){const list=visible(),inc=list.filter(e=>e.kind==='income').reduce((s,e)=>s+e.amount,0),exp=list.filter(e=>e.kind==='expense').reduce((s,e)=>s+e.amount,0),bal=inc-exp,now=localDate(),monthExp=entries.filter(e=>e.kind==='expense'&&e.date.slice(0,7)===now.slice(0,7)).reduce((s,e)=>s+e.amount,0),pct=budget?Math.min(100,monthExp/budget*100):0,period=filter==='today'?'today':filter==='month'?'this month':'all time';$('incomeTotal').textContent=money(inc);$('expenseTotal').textContent=money(exp);$('balance').textContent=money(bal);$('balanceNote').textContent=bal>=0?'available':'over spent';$('incomePeriod').textContent=$('expensePeriod').textContent=period;$('spent').textContent=money(monthExp);$('remaining').textContent=money(budget-monthExp);$('percent').textContent=Math.round(pct)+'%';$('bar').style.width=pct+'%';
$('entries').innerHTML=list.length?list.map(e=>`<article class="entry"><span class="icon ${e.kind}">${e.kind==='income'?'↗':'↙'}</span><div class="entry-main"><b>${escapeHtml(e.category)}</b><small>${escapeHtml(e.note||(e.kind==='income'?'Income received':'Expense paid'))}</small></div><div class="value"><b class="${e.kind}">${e.kind==='income'?'+':'−'}${money(e.amount)}</b><small>${new Date(e.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}</small></div><button class="delete" data-id="${e.id}">×</button></article>`).join(''):'<div class="empty"><b>No entries yet</b>Add your first income or expense above.</div>';
document.querySelectorAll('.delete').forEach(b=>b.onclick=()=>{entries=entries.filter(e=>e.id!==b.dataset.id);save();render()})}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('incomeTab').onclick=()=>switchKind('income');$('expenseTab').onclick=()=>switchKind('expense');$('category').onchange=()=>{$('customWrap').hidden=$('category').value!=='Other';$('customCategory').required=$('category').value==='Other'};
$('entryForm').onsubmit=e=>{e.preventDefault();const amount=Number($('amount').value),cat=$('category').value==='Other'?$('customCategory').value.trim():$('category').value;if(!amount||!cat)return;entries.push({id:Date.now()+'-'+Math.random().toString(36).slice(2),created:Date.now(),kind,amount,category:cat,note:$('note').value.trim(),date:$('date').value});$('amount').value='';$('note').value='';$('customCategory').value='';save();render()};
$('budget').onchange=()=>{budget=Math.max(0,Number($('budget').value)||0);save();render()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({exported:new Date().toISOString(),budget,entries},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='budget-tracker-backup.json';a.click();URL.revokeObjectURL(a.href)};
$('clearBtn').onclick=()=>{if(confirm('Delete every income and expense entry from this phone?')){entries=[];save();render()}};
categories();render();
})();
</script></body></html>
